name: Compilar para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Ejecutar pruebas con Python 3.10
        run: python -W error -m unittest -v

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Compilar YTVault.exe
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onefile `
            --noconsole `
            --clean `
            --name YTVault `
            --icon "assets/yt-vault.ico" `
            --hidden-import downloader `
            --add-data "seed_urls.json;." `
            app.py

      - name: Descargar y verificar herramientas multimedia
        shell: pwsh
        run: |
          function Assert-Sha256($Path, $ChecksumPath, $AssetName) {
            $lines = Get-Content $ChecksumPath
            if ($AssetName) {
              $lines = $lines | Where-Object { $_ -match [regex]::Escape($AssetName) }
            }
            $checksumMatch = $null
            foreach ($line in $lines) {
              $candidate = [regex]::Match($line, '[0-9a-fA-F]{64}')
              if ($candidate.Success) {
                $checksumMatch = $candidate
                break
              }
            }
            if (-not $checksumMatch) { throw "No se encontró SHA-256 para $AssetName" }
            $actual = (Get-FileHash -Algorithm SHA256 $Path).Hash.ToLowerInvariant()
            if ($actual -ne $checksumMatch.Value.ToLowerInvariant()) {
              throw "SHA-256 incorrecto para $Path"
            }
          }

          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "dist/yt-dlp.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/SHA2-256SUMS" `
            -OutFile "yt-dlp.sha256"
          Assert-Sha256 "dist/yt-dlp.exe" "yt-dlp.sha256" "yt-dlp.exe"

          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "ffmpeg.zip"
          Invoke-WebRequest `
            -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256" `
            -OutFile "ffmpeg.sha256"
          Assert-Sha256 "ffmpeg.zip" "ffmpeg.sha256" ""
          Expand-Archive "ffmpeg.zip" -DestinationPath "ffmpeg-build"
          foreach ($name in "ffmpeg.exe", "ffprobe.exe") {
            $binary = Get-ChildItem "ffmpeg-build" -Recurse -Filter $name | Select-Object -First 1
            if (-not $binary) { throw "No se encontró $name en el paquete descargado" }
            Copy-Item $binary.FullName "dist/$name"
          }

          Invoke-WebRequest `
            -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" `
            -OutFile "deno.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip.sha256sum" `
            -OutFile "deno.sha256"
          Assert-Sha256 "deno.zip" "deno.sha256" ""
          Expand-Archive "deno.zip" -DestinationPath "deno-build"
          Copy-Item "deno-build/deno.exe" "dist/deno.exe"

      - name: Crear paquete portable
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/YTVault.exe", "dist/yt-dlp.exe", "dist/ffmpeg.exe", "dist/ffprobe.exe", "dist/deno.exe" `
            -DestinationPath "dist/YTVault-Windows.zip"

      - name: Guardar artefacto
        uses: actions/upload-artifact@v7
        with:
          name: YTVault-Windows
          path: |
            dist/YTVault.exe
            dist/YTVault-Windows.zip
          if-no-files-found: error

      - name: Publicar release para etiquetas
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/YTVault.exe
            dist/YTVault-Windows.zip
